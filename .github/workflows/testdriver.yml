name: TestDriver.ai Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required to mint the OIDC token for auth
      contents: read

    env:
      # Point the sample tests at a publicly reachable deployment of PC Xpress.
      # The TestDriver browser runs in the cloud, so it must be able to reach the
      # target over the public internet. Set this to your production/preview URL
      # (e.g. a Vercel deployment). Repo/environment variable: TD_BASE_URL.
      TD_BASE_URL: ${{ vars.TD_BASE_URL }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --no-frozen-lockfile

    # Authenticate to TestDriver via GitHub OIDC (no stored secret needed once the
    # TestDriver GitHub App is authorized for your org — https://console.testdriver.ai).
    # Falls back to a TD_API_KEY secret if you set one. Exports TD_API_KEY for the run.
    - name: Authenticate to TestDriver
      uses: testdriverai/action@test
      with:
        channel: test
        api-key: ${{ secrets.TD_API_KEY }}

    - name: Run TestDriver.ai tests
      run: npx vitest run

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: test-results/
        retention-days: 30
